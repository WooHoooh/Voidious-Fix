
name: Build Alternate Assist

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  engine-tests:
    name: Engine unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          python3 -c "import zipfile; zipfile.ZipFile('Alternate_Assist_Android_Build_Source.zip').extractall('.')"
          test -f CMakeLists.txt

      - name: Check defaults
        run: python3 tools/check_defaults.py

      - name: Run engine tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I src tests/engine_test.cpp -o engine_test
          ./engine_test

  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android ARM64
            os: ubuntu-latest
            target: Android64
            artifact: alternate-assist-android-arm64

          - name: Windows x64
            os: windows-latest
            target: Win64
            artifact: alternate-assist-windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        shell: python
        run: |
          import zipfile
          with zipfile.ZipFile("Alternate_Assist_Android_Build_Source.zip") as z:
              z.extractall(".")
          import os
          assert os.path.isfile("CMakeLists.txt"), "CMakeLists.txt is missing!"

      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.config.target }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact }}
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
