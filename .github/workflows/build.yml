
name: Build Voidious

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android ARM64
            os: ubuntu-latest
            target: Android64
            artifact: voidious-android-arm64

          - name: Windows x64
            os: windows-latest
            target: Win64
            artifact: voidious-windows-x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build Voidious
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: ${{ matrix.config.target }}

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.artifact }}
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
