
name: Build Voidious

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  engine-tests:
    name: Engine unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check mod defaults
        run: python3 tools/check_defaults.py

      - name: Build and run tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I src tests/engine_test.cpp -o engine_test
          ./engine_test

  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows x64
            os: windows-latest
            target: Win64
            artifact: voidious-windows-x64

          - name: Android ARM64
            os: ubuntu-latest
            target: Android64
            artifact: voidious-android-arm64

    steps:
      - uses: actions/checkout@v7

      - name: Build Voidious
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.config.target }}

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.artifact }}
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
